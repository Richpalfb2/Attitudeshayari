<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found - 404</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .main-content {
      text-align: center;
      padding: 4rem 1rem;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    a.back-home {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #4F46E5;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: background 0.3s;
    }

    a.back-home:hover {
      background-color: #3730A3;
    }

    .image-container {
      margin-top: 3rem;
    }

    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="main-content">
    <h1>😕 404</h1>
    <h2>Page Not Found</h2>
    <p>The page you’re looking for doesn’t exist, has been moved, or the link is incorrect.</p>
    <a href="index.html" class="back-home">⬅️ Back to Homepage</a>

    <div class="image-container">
      <img src="https://2lineattitudeshayari.vercel.app/images/404.webp" alt="Page not found - Shayari" loading="lazy" />
    </div>
  </main>
</body>
</html>
